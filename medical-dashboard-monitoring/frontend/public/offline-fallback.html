<!doctype html>
<html lang="id">
<head>

  <title>NEVO sedang offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f8f8; color: #29292b; font: 15px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #e5e5e5; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 12px 36px #0000000a; }
    strong { color: #b34444; font-size: 24px; letter-spacing: .08em; }
    h1 { margin: 24px 0 8px; font-size: 24px; line-height: 1.3; }
    p { margin: 0; color: #58585b; }
    a { display: block; margin-top: 24px; padding: 12px 20px; border-radius: 12px; background: #b34444; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ec1c24; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <strong>NEVO</strong>
    <h1>NEVO sedang offline</h1>
    <p>Koneksi ke aplikasi belum tersedia. Data SIMRS dan perintah robot tidak dikirim saat offline.</p>

</html>
