services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nevo
      POSTGRES_USER: nevo
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    ports:
      - '127.0.0.1:15432:5432'   # 5432 & 5433 sudah dipakai container lain
    volumes:
      - nevo_pg:/var/lib/postgresql/data
volumes:
  nevo_pg:
